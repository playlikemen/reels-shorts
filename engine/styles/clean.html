<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<style>
:root{--bg:#F6F5F2;--ink:#1B1B1B;--muted:#A2A2A2;--accent:#E2704C;--accent2:#2B2B2B;--tile:#1E1E1E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 45%,#FBFAF8 0%,var(--bg) 60%,#EFEDE8 100%);font-family:Inter,sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0}
.dots{position:absolute;background-image:radial-gradient(circle,rgba(0,0,0,.16) 1.4px,transparent 1.6px);background-size:36px 36px;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 55%,transparent 100%)}
.cap{position:absolute;left:40px;right:40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.seg{max-width:640px;line-height:1.08}
.seg .wd{display:inline-block;white-space:pre}
.seg.s{font-size:29px;font-weight:500}
.seg.m{font-size:37px;font-weight:600}
.seg.l{font-size:52px;font-weight:800;letter-spacing:-.01em}
.seg.xl{font-size:70px;font-weight:800;letter-spacing:-.015em}
.seg.up{text-transform:uppercase}
.seg.pill{background:var(--tile);color:#fff!important;padding:8px 18px 10px;border-radius:14px;box-shadow:0 16px 30px rgba(0,0,0,.22);margin-top:10px}
.seg.pill .wd{color:#fff!important}
.vis{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.tile{display:grid;place-items:center;border-radius:28px;box-shadow:0 22px 40px rgba(0,0,0,.20),0 4px 10px rgba(0,0,0,.08);font-weight:800;color:#fff}
.tile.dark{background:linear-gradient(160deg,#2a2a2a,#121212)}
.tile.light{background:#fff;color:var(--ink)}
.tile.orange{background:linear-gradient(160deg,var(--accentLight,#EE8A66),var(--accentDark,#D9603C))}
.tile.blue{background:linear-gradient(160deg,#6E8BFF,#3D4FE0)}
.tile.none{background:none;box-shadow:none;color:var(--ink)}
.tile .tl{font-size:28px;letter-spacing:-.01em}
.row{display:flex;gap:30px;align-items:center;justify-content:center}
.lbl{font-weight:800;font-size:44px;letter-spacing:-.01em}
.check{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.check .it{display:flex;align-items:center;gap:16px;font-size:36px;font-weight:700}
.card{width:560px;border-radius:18px;background:#0F1115;color:#E8E8E8;padding:22px 24px;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.card .t{font-weight:800;font-size:26px;margin-bottom:12px}
.card .ln{height:10px;border-radius:5px;background:#2A2F38;margin:10px 0}
.card .chips{display:flex;gap:8px;margin:14px 0}
.card .chips span{height:16px;border-radius:4px}
.card .btn{margin:16px auto 0;width:220px;height:36px;border-radius:8px;border:2px solid #4b6cff;display:grid;place-items:center;font-size:15px;color:#9fb0ff}
.ocard{width:560px;border-radius:6px;background:linear-gradient(160deg,#ED875F,#DA6A43);padding:20px 26px;box-shadow:0 30px 60px rgba(0,0,0,.22);color:#2a160f;text-align:center}
.ocard .t{font-weight:800;font-size:40px}
.ocard .s{font-weight:500;font-size:22px;margin:4px 0 14px}
.ocard .ics{display:flex;justify-content:center;gap:22px}
.book{width:300px;height:420px;position:relative;transform-style:preserve-3d}
.book .cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:linear-gradient(135deg,#FFFFFF,#DCDCDC);box-shadow:inset 8px 0 14px rgba(0,0,0,.15),0 30px 50px rgba(0,0,0,.28);padding:30px 24px;text-align:right;font-family:'Space Grotesk';font-weight:700;color:#3a3a3a}
.book .cover .tt{font-size:38px;line-height:1.05;letter-spacing:.01em}
.book .cover .tt em{font-style:normal;color:var(--accent)}
.book .cover .sb{font-size:12px;letter-spacing:.15em;margin-top:14px;text-transform:uppercase;opacity:.7}
.book .spine{position:absolute;left:-26px;top:6px;bottom:6px;width:26px;background:linear-gradient(90deg,#b9b9b9,#e9e9e9);transform:rotateY(-90deg);transform-origin:right}
.big{font-weight:800;font-size:150px;letter-spacing:-.04em;line-height:.9}
.wm{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:34px;color:rgba(0,0,0,.13);letter-spacing:.01em}
.splash{position:absolute;width:360px;height:360px;pointer-events:none}
.svgover{position:absolute;inset:0;pointer-events:none;overflow:visible}
</style>
</head><body><div id="stage"></div>
<script src="../runtime.js"></script>
<script src="../icons.js"></script>
<script src="clean.js"></script>
</body></html>
