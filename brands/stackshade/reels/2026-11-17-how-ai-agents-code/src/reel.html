<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StackShade: How AI Agents Actually Code (The ReAct Loop)</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-700.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-900.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../../../../../shared/fonts/jbmono-700.woff2') format('woff2');
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { width: auto; height: 95vh; aspect-ratio: 9/16; background: #070a12; box-shadow: 0 0 60px rgba(56,189,248,0.25); }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<script src="../out/captions.js"></script>
<script src="../../../../../shared/scripts/reelkit.js"></script>
<script>
window.CUES = [0, 8.5, 15.0, 22.5, 33.0];

window.SCORE = ac => {
  buildScore(ac, {
    bpm: 126,
    dur: 39,
    root: 45, // A
    chords: [0, 3, 5, 2],
    minor: true,
    kickFrom: 0.1,
    level: 0.8,
    hits: [0, 8.5, 15.0, 22.5, 33.0]
  });
};

function drawReel(t) {
  // Background obsidian
  ctx.fillStyle = '#070a12';
  ctx.fillRect(0, 0, W, H);
  techGrid(t, { size: 90, color: 'rgba(56, 189, 248, 0.04)', accent: 'rgba(56, 189, 248, 0.09)' });

  // Retention camera punch on scene cuts
  applyZoomPunch(t, [0, 4.0, 8.5, 15.0, 22.5, 33.0], 1.05);

  // Top Safe Area Watermark (Y: 210)
  txt('STACKSHADE  //  AI ENGINEERING', W / 2, 210, {
    px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#38bdf8', ls: 3, alpha: 0.85
  });

  // Animated Lower Third (0.5s - 4.0s)
  lowerThird(t, {
    brand: 'STACKSHADE',
    topic: 'AUTONOMOUS AGENTS',
    handle: '@stackshade',
    enterAt: 0.5,
    exitAt: 3.8,
    accentColor: '#38bdf8'
  });

  // ==========================================
  // SCENE 1: The Hook (0.0s - 8.5s)
  // ==========================================
  scene(t, 0, 8.5, (st, dur) => {
    badge('AGENTIC AI ARCHITECTURE', W / 2, 420, { px: 32, fill: '#38bdf8', border: '#38bdf8' });

    rise('How AI Agents', W / 2, 530, prog(st, 0.1, 0.5), { px: 74, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('Actually Write Code', W / 2, 620, prog(st, 0.3, 0.5), { px: 74, fam: 'Inter', wt: 900, fill: '#38bdf8' });

    // Hero box
    card(100, 720, 880, 520, {
      bg: 'rgba(15, 23, 42, 0.94)',
      border: 'rgba(56, 189, 248, 0.4)',
      glowColor: 'rgba(56, 189, 248, 0.2)',
      alpha: E.out(prog(st, 0.4, 0.5))
    });

    txt('THE REASONING + ACTING (ReAct) LOOP', W / 2, 800, { px: 32, fam: 'JetBrains Mono', wt: 800, fill: '#38bdf8' });

    // 4 Step Overview
    const steps = [
      { num: '01', title: 'THOUGHT', desc: 'LLM analyzes goal & drafts execution plan' },
      { num: '02', title: 'ACTION', desc: 'Invokes bash, edits files & runs compilers' },
      { num: '03', title: 'OBSERVE', desc: 'Reads stderr output & test pass/fail results' },
      { num: '04', title: 'ITERATE', desc: 'Self-heals bugs until the build succeeds' }
    ];

    steps.forEach((s, idx) => {
      rr(140, 840 + idx * 90, 800, 75, 16, 'rgba(56, 189, 248, 0.1)', 'rgba(56, 189, 248, 0.3)', 2);
      badge(s.num, 190, 878 + idx * 90, { px: 22, fill: '#38bdf8', border: '#38bdf8' });
      txt(s.title, 260, 888 + idx * 90, { px: 26, fam: 'JetBrains Mono', wt: 800, fill: '#ffffff', align: 'left' });
      txt(s.desc, 420, 886 + idx * 90, { px: 22, fam: 'Inter', wt: 600, fill: '#94a3b8', align: 'left' });
    });
  });

  // ==========================================
  // SCENE 2: Step 1 - Reason (8.5s - 15.0s)
  // ==========================================
  scene(t, 8.5, 15.0, (st, dur) => {
    badge('STEP 01 // PLANNING', W / 2, 340, { px: 30, fill: '#a855f7', border: '#a855f7' });
    rise('1. The Reasoning Phase', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(20, 14, 28, 0.94)',
      border: 'rgba(168, 85, 247, 0.4)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    rr(130, 580, 820, 250, 18, '#0d0d1a', 'rgba(168, 85, 247, 0.3)', 2);
    txt('<thought>', 170, 640, { px: 26, fam: 'JetBrains Mono', wt: 700, fill: '#c084fc', align: 'left' });
    txt('"User requested Redis cache integration.', 170, 690, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    txt(' I need to inspect db.go, add connection pool,', 170, 735, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    txt(' and run go test ./... to verify compatibility."', 170, 780, { px: 24, fam: 'Inter', wt: 600, fill: '#94a3b8', align: 'left' });

    const pPlan = prog(st, 3.2, 0.5);
    if (pPlan > 0) {
      card(130, 870, 820, 280, {
        bg: 'rgba(168, 85, 247, 0.12)',
        border: '#a855f7',
        r: 20,
        alpha: E.out(pPlan)
      });
      txt('ARCHITECTURE PLANNING:', 170, 940, { px: 28, fam: 'JetBrains Mono', wt: 800, fill: '#c084fc', align: 'left' });
      txt('• Scans repository structure & dependencies', 170, 1000, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
      txt('• Breaks complex features into sequential tool calls', 170, 1060, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    }
  });

  // ==========================================
  // SCENE 3: Step 2 - Action (15.0s - 22.5s)
  // ==========================================
  scene(t, 15.0, 22.5, (st, dur) => {
    badge('STEP 02 // EXECUTION', W / 2, 340, { px: 30, fill: '#38bdf8', border: '#38bdf8' });
    rise('2. The Action Phase', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(15, 23, 42, 0.94)',
      border: 'rgba(56, 189, 248, 0.4)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    // Mock terminal
    rr(130, 580, 820, 260, 18, '#090d16', 'rgba(56, 189, 248, 0.35)', 2);
    rr(155, 605, 14, 14, 7, '#ef4444', null, 0);
    rr(180, 605, 14, 14, 7, '#f59e0b', null, 0);
    rr(205, 605, 14, 14, 7, '#10b981', null, 0);
    txt('$ agy run "npm test" && git status', 155, 675, { px: 26, fam: 'JetBrains Mono', wt: 700, fill: '#38bdf8', align: 'left' });
    txt('> Executing tool: edit_file(db.go)', 155, 730, { px: 24, fam: 'JetBrains Mono', wt: 600, fill: '#10b981', align: 'left' });
    txt('> Injected Redis connection pooling', 155, 785, { px: 24, fam: 'JetBrains Mono', wt: 600, fill: '#ffffff', align: 'left' });

    const pTool = prog(st, 3.5, 0.5);
    if (pTool > 0) {
      card(130, 880, 820, 270, {
        bg: 'rgba(56, 189, 248, 0.12)',
        border: '#38bdf8',
        r: 20,
        alpha: E.out(pTool)
      });
      txt('AUTONOMOUS TOOL CALLING:', 170, 950, { px: 28, fam: 'JetBrains Mono', wt: 800, fill: '#38bdf8', align: 'left' });
      txt('• Directly reads & edits codebase files', 170, 1010, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
      txt('• Runs test suites inside sandboxed containers', 170, 1070, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    }
  });

  // ==========================================
  // SCENE 4: Step 3 & 4 - Observe & Iterate (22.5s - 33.0s)
  // ==========================================
  scene(t, 22.5, 33.0, (st, dur) => {
    badge('STEP 03 & 04 // SELF-HEALING', W / 2, 340, { px: 30, fill: '#10b981', border: '#10b981' });
    rise('3. Observe & 4. Iterate', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(12, 26, 20, 0.94)',
      border: 'rgba(16, 185, 129, 0.4)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    // Error detected
    rr(130, 580, 820, 150, 18, 'rgba(239, 68, 68, 0.15)', '#ef4444', 2);
    txt('OBSERVE (COMPILER FEEDBACK)', 170, 635, { px: 26, fam: 'JetBrains Mono', wt: 800, fill: '#ef4444', align: 'left' });
    txt('stderr: "redis: nil connection pool timeout at line 42"', 170, 685, { px: 24, fam: 'JetBrains Mono', wt: 600, fill: '#ffffff', align: 'left' });

    // Autonomous Fix
    rr(130, 760, 820, 190, 18, 'rgba(16, 185, 129, 0.15)', '#10b981', 3);
    txt('ITERATE (SELF-HEAL)', 170, 820, { px: 28, fam: 'JetBrains Mono', wt: 900, fill: '#10b981', align: 'left' });
    txt('Agent re-reads the error, increases timeout,', 170, 875, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    txt('and re-runs tests until 100% of test suites PASS!', 170, 915, { px: 24, fam: 'Inter', wt: 700, fill: '#34d399', align: 'left' });

    const pResult = prog(st, 5.0, 0.5);
    if (pResult > 0) {
      card(130, 980, 820, 180, {
        bg: 'rgba(16, 185, 129, 0.2)',
        border: '#10b981',
        r: 18,
        alpha: E.out(pResult)
      });
      txt('✓ 100% PASS: All Tests Passing', W / 2, 1050, { px: 32, fam: 'Inter', wt: 900, fill: '#10b981' });
      txt('Code committed and ready for deployment', W / 2, 1110, { px: 24, fam: 'Inter', wt: 600, fill: '#cbd5e1' });
    }
  });

  // ==========================================
  // SCENE 5: CTA (33.0s - 38.5s)
  // ==========================================
  scene(t, 33.0, 38.5, (st, dur) => {
    badge('MASTER AI ENGINEERING', W / 2, 420, { px: 32, fill: '#38bdf8', border: '#38bdf8' });

    rise('Follow @stackshade', W / 2, 550, prog(st, 0.1, 0.5), { px: 76, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('Daily AI & Agent Breakdowns', W / 2, 640, prog(st, 0.3, 0.5), { px: 46, fam: 'Inter', wt: 800, fill: '#38bdf8' });

    card(140, 750, 800, 420, {
      bg: 'rgba(15, 23, 42, 0.95)',
      border: 'rgba(56, 189, 248, 0.5)',
      glowColor: 'rgba(56, 189, 248, 0.25)',
      alpha: E.out(prog(st, 0.4, 0.5))
    });

    txt('⚡ TOPICS COVERED DAILY:', W / 2, 840, { px: 30, fam: 'JetBrains Mono', wt: 700, fill: '#94a3b8' });
    txt('• Autonomous Agent Loops (ReAct, Plan-Solve)', 200, 920, { px: 30, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
    txt('• MCP (Model Context Protocol) Servers', 200, 990, { px: 30, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
    txt('• LLM Tool Calling & Context Compression', 200, 1060, { px: 30, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
  });

  // ==========================================
  // HORMOZI KINETIC CAPTIONS
  // (Y: 1400, Electric Gold Active Word)
  // ==========================================
  if (window.CAPTIONS) {
    drawKineticCaptions(t, window.CAPTIONS, {
      cy: 1400,
      fontSize: 58,
      activeColor: '#FFE45E', // Viral electric gold
      textColor: '#FFFFFF',
      strokeColor: '#000000',
      strokeWidth: 16,
      showCard: true
    });
  }

  // Safe bottom handle
  txt('@stackshade', W / 2, 1780, { px: 30, fam: 'JetBrains Mono', wt: 700, fill: '#64748b', alpha: 0.8 });
}

// 1150 frames @ 30 FPS = 38.3 seconds
startReel(1150, drawReel);
</script>
</body>
</html>
