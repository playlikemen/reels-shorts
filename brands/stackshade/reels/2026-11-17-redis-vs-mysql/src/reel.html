<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StackShade: Why Redis is 100x Faster Than MySQL</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-700.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-900.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../../../../../shared/fonts/jbmono-700.woff2') format('woff2');
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { width: auto; height: 95vh; aspect-ratio: 9/16; background: #070a12; box-shadow: 0 0 60px rgba(56,189,248,0.2); }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<script src="../out/captions.js"></script>
<script src="../../../../../shared/scripts/reelkit.js"></script>
<script>
window.CUES = [0, 4.5, 14.5, 19.5, 26.5];

window.SCORE = ac => {
  buildScore(ac, {
    bpm: 126,
    dur: 31,
    root: 43, // G
    chords: [0, 3, 5, 2],
    minor: true,
    kickFrom: 0.1,
    level: 0.8,
    hits: [0, 4.5, 14.5, 19.5, 26.5]
  });
};

function drawReel(t) {
  // Background obsidian
  ctx.fillStyle = '#070a12';
  ctx.fillRect(0, 0, W, H);
  techGrid(t, { size: 90, color: 'rgba(56, 189, 248, 0.04)', accent: 'rgba(56, 189, 248, 0.09)' });

  // Retention camera punch on scene cuts & key beats
  applyZoomPunch(t, [0, 4.5, 11.5, 14.8, 19.5, 26.5], 1.05);

  // Top Safe Area Watermark (Y: 210)
  txt('STACKSHADE  //  SYSTEM DESIGN', W / 2, 210, {
    px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#38bdf8', ls: 3, alpha: 0.8
  });

  // Animated Lower Third (0.5s - 4.5s)
  lowerThird(t, {
    brand: 'STACKSHADE',
    topic: 'DATABASE ARCHITECTURE',
    handle: '@stackshade',
    enterAt: 0.6,
    exitAt: 4.2,
    accentColor: '#38bdf8'
  });

  // ==========================================
  // SCENE 1: The 1-Second Hook (0.0s - 4.5s)
  // ==========================================
  scene(t, 0, 4.5, (st, dur) => {
    badge('SYSTEM DESIGN BREAKDOWN', W / 2, 420, { px: 32, fill: '#38bdf8', border: '#38bdf8' });

    rise('Why Redis is 100x', W / 2, 530, prog(st, 0.1, 0.5), { px: 72, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('Faster Than MySQL', W / 2, 620, prog(st, 0.3, 0.5), { px: 74, fam: 'Inter', wt: 900, fill: '#38bdf8' });

    // Hero comparison box
    card(100, 720, 880, 520, {
      bg: 'rgba(15, 23, 42, 0.92)',
      border: 'rgba(56, 189, 248, 0.35)',
      glowColor: 'rgba(56, 189, 248, 0.15)',
      alpha: E.out(prog(st, 0.4, 0.6))
    });

    // Versus Badges
    rr(150, 780, 360, 380, 24, 'rgba(16, 185, 129, 0.12)', '#10b981', 3);
    txt('⚡ REDIS', 330, 850, { px: 42, fam: 'Inter', wt: 900, fill: '#10b981' });
    txt('RAM In-Memory', 330, 910, { px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#ffffff' });
    txt('100 Nanoseconds', 330, 970, { px: 32, fam: 'Inter', wt: 800, fill: '#34d399' });
    txt('Sub-millisecond P99', 330, 1070, { px: 24, fam: 'JetBrains Mono', wt: 600, fill: '#94a3b8' });

    rr(570, 780, 360, 380, 24, 'rgba(245, 158, 11, 0.12)', '#f59e0b', 3);
    txt('💾 MYSQL', 750, 850, { px: 42, fam: 'Inter', wt: 900, fill: '#f59e0b' });
    txt('Disk / NVMe B+Tree', 750, 910, { px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#ffffff' });
    txt('100 Microseconds', 750, 970, { px: 32, fam: 'Inter', wt: 800, fill: '#fbbf24' });
    txt('ACID Persistence', 750, 1070, { px: 24, fam: 'JetBrains Mono', wt: 600, fill: '#94a3b8' });

    txt('VS', W / 2, 980, { px: 36, fam: 'Inter', wt: 900, fill: '#64748b', stroke: '#000', strokeW: 8 });
  });

  // ==========================================
  // SCENE 2: The Hardware Latency Gap (4.5s - 14.5s)
  // ==========================================
  scene(t, 4.5, 14.5, (st, dur) => {
    badge('HARDWARE LATENCY GAP', W / 2, 340, { px: 32, fill: '#f59e0b', border: '#f59e0b' });
    rise('RAM vs NVMe Disk Access', W / 2, 440, prog(st, 0.1, 0.5), { px: 64, fam: 'Inter', wt: 900, fill: '#ffffff' });

    // Main comparison card
    card(90, 520, 900, 680, {
      bg: 'rgba(15, 23, 42, 0.92)',
      border: 'rgba(255, 255, 255, 0.18)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    txt('STORAGE ACCESS TIME HIERARCHY', 140, 590, { px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#94a3b8', align: 'left' });

    // Redis RAM Bar (100ns)
    const pRam = prog(st, 0.8, 0.8);
    bar('Redis: Main Memory (RAM)', '100 ns', 0.12, 140, 670, 800, 48, {
      p: pRam, fill: '#10b981'
    });
    txt('⚡ Direct CPU pointer lookup (L1/L2/RAM cache lines)', 140, 760, { px: 24, fam: 'Inter', wt: 600, fill: '#64748b', align: 'left' });

    // MySQL Disk Bar (100,000ns)
    const pDisk = prog(st, 3.2, 0.8);
    bar('MySQL: NVMe SSD / Disk I/O', '100,000 ns', 0.94, 140, 870, 800, 48, {
      p: pDisk, fill: '#f59e0b'
    });
    txt('📁 File system syscalls, buffer pool page evictions & fsync', 140, 960, { px: 24, fam: 'Inter', wt: 600, fill: '#64748b', align: 'left' });

    // 1000x Multiplier Banner (pops in at 6.8s)
    const pBanner = prog(st, 6.5, 0.5);
    if (pBanner > 0) {
      card(130, 1030, 820, 130, {
        bg: 'rgba(239, 68, 68, 0.15)',
        border: '#ef4444',
        r: 20,
        alpha: E.out(pBanner)
      });
      txt('1,000x HARDWARE LATENCY GAP', W / 2, 1090, { px: 38, fam: 'Inter', wt: 900, fill: '#f87171' });
      txt('Physics dictates that RAM will ALWAYS crush disk I/O', W / 2, 1135, { px: 22, fam: 'Inter', wt: 600, fill: '#cbd5e1' });
    }
  });

  // ==========================================
  // SCENE 3: Single-Threaded Architecture (14.5s - 19.5s)
  // ==========================================
  scene(t, 14.5, 19.5, (st, dur) => {
    badge('CONCURRENCY MODEL', W / 2, 340, { px: 32, fill: '#38bdf8', border: '#38bdf8' });
    rise('Zero Lock Contention', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    // Left card: Redis Event Loop
    card(90, 520, 430, 680, {
      bg: 'rgba(12, 28, 22, 0.9)',
      border: 'rgba(16, 185, 129, 0.4)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });
    badge('REDIS', 305, 580, { px: 26, fill: '#10b981', border: '#10b981' });
    txt('Single-Threaded', 305, 660, { px: 36, fam: 'Inter', wt: 900, fill: '#ffffff' });
    txt('Linux epoll Multiplexing', 305, 710, { px: 22, fam: 'JetBrains Mono', wt: 600, fill: '#94a3b8' });

    txt('• No Mutex locks', 130, 800, { px: 26, fam: 'Inter', wt: 700, fill: '#34d399', align: 'left' });
    txt('• No Thread switches', 130, 860, { px: 26, fam: 'Inter', wt: 700, fill: '#34d399', align: 'left' });
    txt('• Pure CPU cache locality', 130, 920, { px: 26, fam: 'Inter', wt: 700, fill: '#34d399', align: 'left' });
    txt('• 100k+ ops / sec', 130, 980, { px: 26, fam: 'Inter', wt: 700, fill: '#34d399', align: 'left' });

    // Right card: MySQL Multi-Threaded
    card(560, 520, 430, 680, {
      bg: 'rgba(28, 20, 12, 0.9)',
      border: 'rgba(245, 158, 11, 0.4)',
      alpha: E.out(prog(st, 0.5, 0.5))
    });
    badge('MYSQL', 775, 580, { px: 26, fill: '#f59e0b', border: '#f59e0b' });
    txt('Multi-Threaded', 775, 660, { px: 36, fam: 'Inter', wt: 900, fill: '#ffffff' });
    txt('InnoDB Buffer Contention', 775, 710, { px: 22, fam: 'JetBrains Mono', wt: 600, fill: '#94a3b8' });

    txt('• Row-level table locks', 600, 800, { px: 26, fam: 'Inter', wt: 700, fill: '#fbbf24', align: 'left' });
    txt('• Thread context switching', 600, 860, { px: 26, fam: 'Inter', wt: 700, fill: '#fbbf24', align: 'left' });
    txt('• WAL redo-log disk flushes', 600, 920, { px: 26, fam: 'Inter', wt: 700, fill: '#fbbf24', align: 'left' });
    txt('• ACID transactions', 600, 980, { px: 26, fam: 'Inter', wt: 700, fill: '#fbbf24', align: 'left' });
  });

  // ==========================================
  // SCENE 4: The Production Architecture (19.5s - 26.5s)
  // ==========================================
  scene(t, 19.5, 26.5, (st, dur) => {
    badge('RECOMMENDED ARCHITECTURE', W / 2, 340, { px: 32, fill: '#10b981', border: '#10b981' });
    rise('Cache-Aside Pattern', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(15, 23, 42, 0.92)',
      border: 'rgba(56, 189, 248, 0.35)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    // Step 1: Client Request
    rr(140, 580, 800, 140, 20, 'rgba(56, 189, 248, 0.12)', '#38bdf8', 2);
    txt('1. CLIENT APP', 180, 640, { px: 28, fam: 'JetBrains Mono', wt: 800, fill: '#38bdf8', align: 'left' });
    txt('Checks in-memory cache first (Sub-millisecond hit)', 180, 685, { px: 24, fam: 'Inter', wt: 600, fill: '#e2e8f0', align: 'left' });

    // Step 2: Redis Cache Layer (95% of traffic)
    rr(140, 750, 800, 180, 20, 'rgba(16, 185, 129, 0.15)', '#10b981', 3);
    badge('CACHE HIT (95%)', 800, 800, { px: 24, fill: '#10b981', border: '#10b981' });
    txt('2. REDIS CACHE BUFFER', 180, 820, { px: 32, fam: 'Inter', wt: 900, fill: '#10b981', align: 'left' });
    txt('Absorbs 95% of reads with 0.1ms latency', 180, 875, { px: 24, fam: 'Inter', wt: 600, fill: '#e2e8f0', align: 'left' });

    // Step 3: MySQL Persistent Store (5% of traffic)
    rr(140, 960, 800, 180, 20, 'rgba(245, 158, 11, 0.15)', '#f59e0b', 3);
    badge('PERSISTENCE (5%)', 790, 1010, { px: 24, fill: '#f59e0b', border: '#f59e0b' });
    txt('3. MYSQL DATABASE', 180, 1030, { px: 32, fam: 'Inter', wt: 900, fill: '#f59e0b', align: 'left' });
    txt('Source of truth for transactions & ACID guarantees', 180, 1085, { px: 24, fam: 'Inter', wt: 600, fill: '#e2e8f0', align: 'left' });
  });

  // ==========================================
  // SCENE 5: Final CTA (26.5s - 31.0s)
  // ==========================================
  scene(t, 26.5, 31.0, (st, dur) => {
    badge('LEVEL UP YOUR SYSTEM DESIGN', W / 2, 420, { px: 32, fill: '#38bdf8', border: '#38bdf8' });

    rise('Follow @stackshade', W / 2, 560, prog(st, 0.1, 0.5), { px: 76, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('Daily Engineering Breakdowns', W / 2, 650, prog(st, 0.3, 0.5), { px: 46, fam: 'Inter', wt: 800, fill: '#38bdf8' });

    card(140, 760, 800, 420, {
      bg: 'rgba(15, 23, 42, 0.95)',
      border: 'rgba(56, 189, 248, 0.5)',
      glowColor: 'rgba(56, 189, 248, 0.25)',
      alpha: E.out(prog(st, 0.4, 0.5))
    });

    txt('⚡ WHAT WE COVER DAILY:', W / 2, 850, { px: 30, fam: 'JetBrains Mono', wt: 700, fill: '#94a3b8' });
    txt('• High-Throughput System Design', 220, 930, { px: 32, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
    txt('• Autonomous AI Agents & MCP', 220, 1000, { px: 32, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
    txt('• Backend Concurrency & Linux Internals', 220, 1070, { px: 32, fam: 'Inter', wt: 700, fill: '#ffffff', align: 'left' });
  });

  // ==========================================
  // HORMOZI KINETIC CAPTIONS
  // (Always active across all scenes, Y: 1400)
  // ==========================================
  if (window.CAPTIONS) {
    drawKineticCaptions(t, window.CAPTIONS, {
      cy: 1400,
      fontSize: 60,
      activeColor: '#FFE45E', // Electric viral yellow
      textColor: '#FFFFFF',
      strokeColor: '#000000',
      strokeWidth: 16,
      showCard: true
    });
  }

  // Safe bottom handle
  txt('@stackshade', W / 2, 1780, { px: 30, fam: 'JetBrains Mono', wt: 700, fill: '#64748b', alpha: 0.8 });
}

// 930 frames @ 30 FPS = 31.0 seconds
startReel(930, drawReel);
</script>
</body>
</html>
