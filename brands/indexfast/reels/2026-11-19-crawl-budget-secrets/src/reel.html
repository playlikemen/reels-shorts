function drawFrame(t) {
  ctx.save();
  punchCamera(t, [0.8, 3.5, 7.5, 12.0], 0.45, 1.07);

  // Background
  ctx.fillStyle = "#060D0A";
  ctx.fillRect(0, 0, W, H);
  grid(t, 64, "rgba(16, 185, 129, 0.05)", "rgba(16, 185, 129, 0.12)");

  const hp = clamp(t / 0.5);

    const hy = 280;

    noGlow();
    txt("CRAWL HACK", 540, hy + 120, { px: 22, fam: "Inter", wt: 900, fill: "#000", align: "center", alpha: hp });
  }

  // Hook Title (0 - 3.2s)
  if (t < 3.2) {
    const hookProg = clamp(t / 0.4);
    const hookAlpha = t > 2.6 ? (3.2 - t) / 0.6 : 1.0;
    ctx.save();
    setA(hookAlpha * hookProg);
    glow("rgba(0,0,0,0.8)", 30);
    txt("Googlebot is ignoring 80% of your new pages!", 540, 520, { px: 52, fam: "Inter", wt: 900, fill: "#FFFFFF", stroke: "#000", strokeW: 14, align: "center" });

    ctx.restore();

    title: "googlebot-crawler-audit — 1080×1920",

    glowColor: "rgba(16, 185, 129, 0.2)",

  renderCaptions(t);

  // Bottom Safe Zone

function renderCaptions(t) {
  let curGroup = null;
  for (const g of GROUPS) {
    if (t >= g.start && t <= g.end + 0.3) {
      curGroup = g;
      break;
    }
  }
  if (!curGroup) return;

  const words = curGroup.words || [];
  if (!words.length) return;

  ctx.save();
  ctx.font = '900 68px "Inter", -apple-system, sans-serif';

  let totalW = 0;
  const wordWidths = words.map(w => {
    const wWidth = ctx.measureText(w.word.toUpperCase()).width;
    totalW += wWidth + 24;
    return wWidth;
  });
  totalW -= 24;

  const startX = 540 - totalW / 2;
  const capY = 1320;

  rr(startX - 36, capY - 76, totalW + 72, 106, 28, "rgba(0, 0, 0, 0.85)", "rgba(16, 185, 129, 0.25)", 2);

  let curX = startX;
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const isActive = t >= w.start && t <= w.end + 0.15;
    const wordStr = w.word.toUpperCase();
    const wWidth = wordWidths[i];

    ctx.save();
    if (isActive) {
      const wordProg = clamp((t - w.start) / 0.15);
      const scale = 1.0 + Math.sin(wordProg * Math.PI) * 0.18;
      ctx.translate(curX + wWidth / 2, capY);
      ctx.scale(scale, scale);
      ctx.translate(-(curX + wWidth / 2), -capY);

      glow("#FFE45E", 24);
      txt(wordStr, curX, capY, { px: 68, fam: "Inter", wt: 900, fill: "#FFE45E", stroke: "#000000", strokeW: 16, align: "left" });
      noGlow();
    } else {
      txt(wordStr, curX, capY, { px: 68, fam: "Inter", wt: 900, fill: "#FFFFFF", stroke: "#000000", strokeW: 12, align: "left" });
    }
    ctx.restore();
    curX += wWidth + 24;
  }
  ctx.restore();
}
