<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IndexFast: Why Google Takes 3 Weeks to Index (And How to Index in 24 Hours)</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-700.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../shared/fonts/inter-900.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../../../../../shared/fonts/jbmono-700.woff2') format('woff2');
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { width: auto; height: 95vh; aspect-ratio: 9/16; background: #060d0a; box-shadow: 0 0 60px rgba(16,185,129,0.25); }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<script src="../out/captions.js"></script>
<script src="../../../../../shared/scripts/reelkit.js"></script>
<script>
window.CUES = [0, 4.0, 14.8, 20.8, 27.8];

window.SCORE = ac => {
  buildScore(ac, {
    bpm: 128,
    dur: 35,
    root: 48, // C
    chords: [0, 3, 5, 7],
    minor: false,
    kickFrom: 0.1,
    level: 0.8,
    hits: [0, 4.0, 14.8, 20.8, 27.8]
  });
};

function drawReel(t) {
  // Emerald deep obsidian background
  ctx.fillStyle = '#060d0a';
  ctx.fillRect(0, 0, W, H);
  techGrid(t, { size: 90, color: 'rgba(16, 185, 129, 0.035)', accent: 'rgba(16, 185, 129, 0.08)' });

  // Camera punch on each key reveal
  applyZoomPunch(t, [0, 4.0, 8.0, 14.8, 20.8, 27.8], 1.05);

  // Top Safe Area Watermark (Y: 210)
  txt('INDEXFAST  //  SEO AUTOMATION', W / 2, 210, {
    px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#10b981', ls: 3, alpha: 0.85
  });

  // Animated Lower Third (0.5s - 4.0s)
  lowerThird(t, {
    brand: 'INDEXFAST',
    topic: 'CRAWL BUDGET SECRETS',
    handle: '@indexfast',
    enterAt: 0.5,
    exitAt: 3.8,
    accentColor: '#10b981'
  });

  // ==========================================
  // SCENE 1: The 3-Week Delay Hook (0.0s - 4.0s)
  // ==========================================
  scene(t, 0, 4.0, (st, dur) => {
    badge('GOOGLE INDEXING TRUTH', W / 2, 420, { px: 32, fill: '#10b981', border: '#10b981' });

    rise('Why Google Takes', W / 2, 530, prog(st, 0.1, 0.5), { px: 74, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('3 Weeks to Index', W / 2, 620, prog(st, 0.3, 0.5), { px: 76, fam: 'Inter', wt: 900, fill: '#ef4444' });

    // Warning Card
    card(100, 720, 880, 520, {
      bg: 'rgba(12, 24, 18, 0.94)',
      border: 'rgba(16, 185, 129, 0.4)',
      glowColor: 'rgba(16, 185, 129, 0.2)',
      alpha: E.out(prog(st, 0.4, 0.5))
    });

    txt('ORGANIC TRAFFIC DELAY', W / 2, 800, { px: 32, fam: 'JetBrains Mono', wt: 800, fill: '#34d399' });

    // Comparison Bars in Scene 1
    bar('Standard Sitemap Waiting', '21 - 30 Days', 0.92, 140, 880, 800, 48, {
      p: prog(st, 0.6, 0.6), fill: '#ef4444'
    });
    txt('Your fresh content sits in the Google Sandbox with ZERO clicks', 140, 970, { px: 24, fam: 'Inter', wt: 600, fill: '#94a3b8', align: 'left' });

    bar('Direct API Indexing', '< 24 Hours', 0.12, 140, 1070, 800, 48, {
      p: prog(st, 1.2, 0.6), fill: '#10b981'
    });
    txt('Googlebot visits and indexes pages within hours', 140, 1160, { px: 24, fam: 'Inter', wt: 600, fill: '#94a3b8', align: 'left' });
  });

  // ==========================================
  // SCENE 2: The Crawl Budget Bottleneck (4.0s - 14.8s)
  // ==========================================
  scene(t, 4.0, 14.8, (st, dur) => {
    badge('THE TECHNICAL BOTTLENECK', W / 2, 340, { px: 30, fill: '#f59e0b', border: '#f59e0b' });
    rise('Googlebot Crawl Budgets', W / 2, 440, prog(st, 0.1, 0.5), { px: 66, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(18, 26, 20, 0.94)',
      border: 'rgba(245, 158, 11, 0.35)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    // Step 1: XML sitemap queue
    rr(130, 580, 820, 240, 18, '#121812', 'rgba(245, 158, 11, 0.4)', 2);
    txt('1. PASSIVE XML SITEMAP POLLING', 170, 640, { px: 28, fam: 'JetBrains Mono', wt: 800, fill: '#f59e0b', align: 'left' });
    txt('• You submit sitemap.xml to Google Search Console', 170, 700, { px: 26, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
    txt('• Google queues new URLs behind billions of authority domains', 170, 750, { px: 26, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });

    // Step 2: Crawl budget limits
    const pQueue = prog(st, 3.8, 0.5);
    if (pQueue > 0) {
      card(130, 860, 820, 300, {
        bg: 'rgba(239, 68, 68, 0.12)',
        border: '#ef4444',
        r: 20,
        alpha: E.out(pQueue)
      });
      txt('🚨 WHY YOU GET STUCK IN QUEUE:', 170, 930, { px: 28, fam: 'JetBrains Mono', wt: 800, fill: '#ef4444', align: 'left' });
      txt('• Google assigns new domains minimal crawl budget', 170, 990, { px: 26, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
      txt('• Googlebot only checks XML sitemaps every 2 to 4 weeks', 170, 1050, { px: 26, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
      txt('• Result: 21 days of lost organic impressions and sales', 170, 1110, { px: 26, fam: 'Inter', wt: 600, fill: '#f87171', align: 'left' });
    }
  });

  // ==========================================
  // SCENE 3: The Growth Hack (14.8s - 27.8s)
  // ==========================================
  scene(t, 14.8, 27.8, (st, dur) => {
    badge('THE INSTANT API PUSH', W / 2, 340, { px: 30, fill: '#10b981', border: '#10b981' });
    rise('Google Indexing API + IndexNow', W / 2, 440, prog(st, 0.1, 0.5), { px: 64, fam: 'Inter', wt: 900, fill: '#ffffff' });

    card(90, 520, 900, 680, {
      bg: 'rgba(12, 28, 20, 0.94)',
      border: 'rgba(16, 185, 129, 0.4)',
      alpha: E.out(prog(st, 0.2, 0.5))
    });

    // 3 Step Process
    const steps = [
      { title: '1. Instant Webhook Notification', desc: 'Server pings Google Cloud API the instant you publish a URL' },
      { title: '2. Priority Crawler Queue Bypass', desc: 'Googlebot bypasses standard backlog and crawls within 6-12 hours' },
      { title: '3. Live in Google SERPs in < 24h', desc: 'Pages appear in Google search results 24x faster than competitors' }
    ];

    steps.forEach((s, idx) => {
      const sp = prog(st, 0.5 + idx * 2.2, 0.5);
      if (sp > 0) {
        rr(130, 580 + idx * 170, 820, 145, 18, 'rgba(16, 185, 129, 0.12)', '#10b981', 2);
        txt(s.title, 170, 635 + idx * 170, { px: 28, fam: 'Inter', wt: 800, fill: '#34d399', align: 'left' });
        txt(s.desc, 170, 685 + idx * 170, { px: 24, fam: 'Inter', wt: 600, fill: '#ffffff', align: 'left' });
      }
    });

    // Metric badge
    const pMetric = prog(st, 7.5, 0.5);
    if (pMetric > 0) {
      card(130, 1100, 820, 80, {
        bg: 'rgba(16, 185, 129, 0.2)',
        border: '#10b981',
        r: 16,
        alpha: E.out(pMetric)
      });
      txt('⚡ Slashes Indexing Time From 21 Days to < 24 Hours', W / 2, 1152, {
        px: 26, fam: 'JetBrains Mono', wt: 800, fill: '#ffffff'
      });
    }
  });

  // ==========================================
  // SCENE 4: CTA & Free Trial (27.8s - 34.3s)
  // ==========================================
  scene(t, 27.8, 34.3, (st, dur) => {
    badge('AUTOMATE YOUR SEO TODAY', W / 2, 420, { px: 32, fill: '#10b981', border: '#10b981' });

    rise('Get Indexed on Google', W / 2, 550, prog(st, 0.1, 0.5), { px: 76, fam: 'Inter', wt: 900, fill: '#ffffff' });
    rise('In Hours, Not Weeks 🚀', W / 2, 640, prog(st, 0.3, 0.5), { px: 52, fam: 'Inter', wt: 900, fill: '#10b981' });

    card(140, 750, 800, 420, {
      bg: 'rgba(12, 28, 20, 0.95)',
      border: 'rgba(16, 185, 129, 0.5)',
      glowColor: 'rgba(16, 185, 129, 0.25)',
      alpha: E.out(prog(st, 0.4, 0.5))
    });

    txt('TRY FREE AT:', W / 2, 840, { px: 28, fam: 'JetBrains Mono', wt: 700, fill: '#94a3b8' });
    txt('indexfast.co', W / 2, 930, { px: 72, fam: 'Inter', wt: 900, fill: '#34d399' });
    txt('⚡ 200 Free Indexing Requests Included', W / 2, 1020, { px: 30, fam: 'Inter', wt: 800, fill: '#f59e0b' });
    txt('Follow @indexfast for Daily SEO Automation', W / 2, 1100, { px: 26, fam: 'Inter', wt: 700, fill: '#cbd5e1' });
  });

  // ==========================================
  // HORMOZI KINETIC CAPTIONS
  // (Y: 1400, Electric Gold/Cyan Active Word)
  // ==========================================
  if (window.CAPTIONS) {
    drawKineticCaptions(t, window.CAPTIONS, {
      cy: 1400,
      fontSize: 58,
      activeColor: '#FFE45E', // Viral electric gold
      textColor: '#FFFFFF',
      strokeColor: '#000000',
      strokeWidth: 16,
      showCard: true
    });
  }

  // Safe bottom handle
  txt('indexfast.co  •  @indexfast', W / 2, 1780, { px: 30, fam: 'JetBrains Mono', wt: 700, fill: '#64748b', alpha: 0.8 });
}

// 1030 frames @ 30 FPS = 34.3 seconds
startReel(1030, drawReel);
</script>
</body>
</html>
